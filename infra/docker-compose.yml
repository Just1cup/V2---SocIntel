services:
  postgres:
    image: postgres:17
    container_name: socintel_v2_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socintel_v2}
      POSTGRES_USER: ${POSTGRES_USER:-socintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: socintel_v2_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in your environment}"]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
