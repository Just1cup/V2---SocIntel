
services:

  postgres:
    image: postgres:17-alpine
    container_name: socintel_v2_postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-socintel_v2}
      POSTGRES_USER:     ${POSTGRES_USER:-socintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}

    command: >
      postgres
        -c shared_buffers=64MB
        -c effective_cache_size=128MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c max_connections=50
        -c checkpoint_completion_target=0.9
        -c wal_buffers=8MB
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c min_wal_size=256MB
        -c max_wal_size=1GB
        -c log_min_duration_statement=1000
        -c log_connections=off
        -c log_disconnections=off
        -c autovacuum_max_workers=2
        -c autovacuum_naptime=30s

    ports:
      - "${DOCKER_BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:${POSTGRES_CONTAINER_PORT:-5432}"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socintel} -d ${POSTGRES_DB:-socintel_v2}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: socintel_v2_redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your environment}
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
        --loglevel warning
        --tcp-keepalive 60
        --timeout 300
        --databases 4
        --hz 15
        --lazyfree-lazy-eviction yes
        --lazyfree-lazy-expire yes

    ports:
      - "${DOCKER_BIND_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:${REDIS_CONTAINER_PORT:-6379}"

    deploy:
      resources:
        limits:
          memory: 160M
        reservations:
          memory: 32M

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    driver: local
